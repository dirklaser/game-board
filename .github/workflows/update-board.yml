name: Update game board

on:
  schedule:
    # Backup only, in case the cycle ever breaks: GitHub often delays or skips these.
    # The real cycle is the "Queue the next update" step at the bottom.
    - cron: "*/30 * * * *"
  workflow_dispatch:   # adds a "Run workflow" button for manual updates

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets each run start the next one

concurrency:
  group: pages
  cancel-in-progress: false   # let a running update finish; the newest waiting one runs next

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -u build_board.py
        timeout-minutes: 6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Queue the next update
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR=$(TZ=America/Chicago date +%-H)
          # Every ~4-5 minutes from 9 AM to 1 AM Central; every ~30 minutes overnight.
          # The cycle never stops, so it never needs restarting.
          if [ "$HOUR" -ge 9 ] || [ "$HOUR" -lt 1 ]; then
            sleep 150
          else
            sleep 1650
          fi
          gh workflow run update-board.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Next update queued."
